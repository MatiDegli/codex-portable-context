[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-portable-context"
version = "1.0.0"
description = "Local-first, read-only Codex session mirror tooling."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
codex-session-mirror = "codex_portable_context.cli.mirror:main"
codex-session-list = "codex_portable_context.cli.list:main"
codex-session-open = "codex_portable_context.cli.open:main"
codex-session-latest = "codex_portable_context.cli.latest:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
pretty = true
show_error_codes = true
files = ["src"]
